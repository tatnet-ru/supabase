name: Next.js example security checks

on:
  pull_request:
    branches: ['tatnet/2026.10.12']
    paths:
      - 'examples/user-management/nextjs-user-management/**'
      - 'examples/clerk/**'
      - '.github/scripts/check-next-security-example.mjs'
      - '.github/workflows/security-next-examples.yml'

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/user-management/nextjs-user-management
          - examples/clerk
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --no-experimental-webstorage
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --ignore-scripts --package-lock=false
        working-directory: ${{ matrix.example }}
      - run: npm run build
        working-directory: ${{ matrix.example }}
      - run: node .github/scripts/check-next-security-example.mjs '${{ matrix.example }}'
